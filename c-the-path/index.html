<script>
(function(){
 var B=JSON.parse(document.getElementById('blob').textContent),K='preview-key-1',f=document.getElementById('f'),p=document.getElementById('p'),m=document.getElementById('m'),b=document.getElementById('b');
 function u(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
 function hex(a){return btoa(String.fromCharCode.apply(null,a))}
 function get(){try{return localStorage.getItem(K)}catch(e){return null}}
 function put(v){try{localStorage.setItem(K,v)}catch(e){}}
 function drop(){try{localStorage.removeItem(K)}catch(e){}}
 function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u(B.s),iterations:B.n},k,256)}).then(function(r){return new Uint8Array(r)})}
 function open(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u(B.i)},k,u(B.c))}).then(function(d){return new TextDecoder().decode(d)})}
 function show(h){document.open();document.write(h);document.close()}
 if(!window.crypto||!crypto.subtle){m.textContent='This browser cannot open the page. Try a recent Chrome or Safari.';b.disabled=true;return}
 var saved=get();
 if(saved){
  // Wait for the page to finish loading, or document.write adds to it instead of replacing it.
  document.body.style.visibility='hidden';
  var go=function(){open(u(saved)).then(show).catch(function(){drop();document.body.style.visibility='';p.focus()})};
  if(document.readyState==='complete')go();else window.addEventListener('load',go);
 }else{p.focus()}
 f.addEventListener('submit',function(e){
  e.preventDefault();b.disabled=true;m.textContent='';
  derive(p.value.trim().toLowerCase()).then(function(raw){return open(raw).then(function(h){put(hex(raw));show(h)})}).catch(function(){b.disabled=false;m.textContent='That password didn\u2019t work.';p.select()});
 });
})();
